name: Daily report

on:
  schedule:
    # 14:00 Utah time. GitHub cron is UTC and ignores DST, so both hours are scheduled and the
    # gate job keeps the one that is 14:00 in America/Denver: 21:00 UTC in MST, 20:00 UTC in MDT.
    - cron: "0 21 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the report
  actions: write    # start the Pages deploy workflow
  id-token: write   # claude-code-action
  issues: write     # open an issue when a run fails

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        # Decided by which schedule fired, not the clock: scheduled runs can start late.
        run: |
          offset=$(TZ=America/Denver date +%z)
          case "${{ github.event_name }}/${{ github.event.schedule }}/$offset" in
            schedule/"0 21 * * *"/-0700|schedule/"0 20 * * *"/-0600|workflow_dispatch/*) go=true ;;
            *) go=false ;;
          esac
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} schedule='${{ github.event.schedule }}' offset=$offset go=$go"

  report:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch weather data
        id: fetch
        run: |
          raw=$(python3 scripts/fetch.py)
          run_id=$(basename "$raw" .json)
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Run $run_id"

      - name: Assess (Claude)
        id: claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: >-
            Follow agent/prompt.md exactly.
            RUN_ID=${{ steps.fetch.outputs.run_id }}
            RAW=raw/${{ steps.fetch.outputs.run_id }}.json
            trigger=${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python3 scripts/validate.py:*),Bash(python scripts/validate.py:*)"

      - name: Usage summary
        if: always() && steps.claude.outputs.execution_file
        run: |
          python3 scripts/usage.py "${{ steps.claude.outputs.execution_file }}" >> "$GITHUB_STEP_SUMMARY"
          cp "${{ steps.claude.outputs.execution_file }}" raw/claude-transcript.json

      - name: Validate
        run: python3 scripts/validate.py "site/reports/${{ steps.fetch.outputs.run_id }}.json" --raw "raw/${{ steps.fetch.outputs.run_id }}.json"

      - name: Publish
        run: python3 scripts/publish.py "site/reports/${{ steps.fetch.outputs.run_id }}.json" --commit "$GITHUB_SHA"

      - name: Commit report
        run: |
          git config user.name "huginn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/reports
          git commit -m "Report ${{ steps.fetch.outputs.run_id }}"
          git push

      - name: Keep raw data
        if: always() && steps.fetch.outputs.run_id
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-${{ steps.fetch.outputs.run_id }}
          path: raw/
          retention-days: 90

      # A deploy from this run would reuse the triggering commit's build ID and Pages would keep
      # the earlier build, so hand off to pages.yml, which runs on the new commit.
      - name: Deploy site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Report run failed: ${{ steps.fetch.outputs.run_id || github.run_id }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
